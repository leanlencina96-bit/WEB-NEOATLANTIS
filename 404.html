<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — NeoAtlantis</title>
<meta name="description" content="La página que buscás no existe.">
<meta name="theme-color" content="#05070A">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{ --void:#05070A; --navy:#0D1424; --off:#EDEEF1; --ink:#0D1424; --body:#4B5563; --line:#D5D8DE; --accent:#3554E0; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter','Segoe UI',system-ui,sans-serif; color:var(--body); background:var(--off); line-height:1.75;}
  header{background:var(--void);}
  .wrap{max-width:760px; margin:0 auto; padding-inline:24px;}
  header .wrap{height:72px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; gap:10px; align-items:center; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:600; letter-spacing:-0.01em; text-decoration:none;}
  .brand img{width:30px; height:30px;}
  .back{color:#EDEEF1; text-decoration:none; font-size:0.9rem; min-height:44px; display:inline-flex; align-items:center;}
  main{padding-block:48px 72px;}
  h1{font-family:'Space Grotesk',sans-serif; color:var(--ink); font-size:clamp(1.8rem,4vw,2.4rem); line-height:1.15; letter-spacing:-0.02em; margin-bottom:12px;}
  .meta{font-size:0.9rem; margin-bottom:32px;}
  .callout{background:#fff; border-left:3px solid var(--accent); border-radius:6px; padding:16px 20px; color:var(--ink); margin-bottom:36px;}
  h2{font-family:'Space Grotesk',sans-serif; color:var(--ink); font-size:1.2rem; margin:32px 0 8px;}
  ul{padding-left:20px;} li{margin-bottom:6px;}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent); outline-offset:3px;}

  body{background:var(--void); color:rgba(255,255,255,0.75);}
  .nf{min-height:calc(100dvh - 72px); display:grid; place-items:center; text-align:center; padding:48px 24px;}
  .nf .code{font-family:'Space Grotesk',sans-serif; font-size:5rem; font-weight:700; color:#4C6FFF; line-height:1;}
  .nf h1{color:#EDEEF1; margin:16px 0 8px;}
  .nf p{max-width:440px; margin:0 auto 28px;}
  .btn{display:inline-flex; align-items:center; min-height:48px; padding:12px 28px; border-radius:999px; background:#fff; color:#05070A; font-weight:600; text-decoration:none;}
</style>
<!-- Vercel Web Analytics: visitas anónimas, sin cookies -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<header><div class="wrap"><a href="/" class="brand"><img src="/assets/isotipo.png" alt="">NEOATLANTIS</a><a href="/" class="back">← Volver al inicio</a></div></header>
<main class="nf"><div>
  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>Puede que el link esté mal escrito o que la página se haya movido.</p>
  <a href="/" class="btn">Ir al inicio</a>
</div></main>
</body>
</html>
